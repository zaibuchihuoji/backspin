version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dev-deps:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/sdks/typescript"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
