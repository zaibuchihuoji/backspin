name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check backspin/ tests/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy backspin/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.10"
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # 3.9 skips the anthropic SDK (dropped 3.9), which drags total
      # coverage below the normal gate; relax just that leg.
      - run: >
          pytest -q --cov=backspin --cov-report=xml --cov-report=term
          ${{ matrix.python == '3.9' && '--cov-fail-under=60' || '' }}

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - working-directory: sdks/typescript
        run: |
          npm ci
          npm test
      # the published tarball must not ship tests and must typecheck clean
      - working-directory: sdks/typescript
        run: |
          rm -rf dist
          npm run build
          test ! -d dist/test
